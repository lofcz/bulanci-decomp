[package]
name = "bulanci_client"
version = "0.1.0"
edition = "2021"

[dependencies]
bulanci_core = { path = "../core" }
macroquad = "0.4"
rodio = "0.17"
postcard = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
anyhow = "1.0"
chrono = "0.4"
# NOT imported directly anywhere — this dependency exists purely to
# extend the `image` crate's feature set via Cargo's feature unification
# so that macroquad's own image decoder (`macroquad::Texture2D::
# from_file_with_format`) can decode JPEGs at runtime. Upstream
# macroquad 0.4 pins `image` with `default-features = false,
# features = ["png", "tga"]`, which omits the `jpeg` decoder; adding
# `jpeg` here unifies the feature back in for all our `.jpg` assets
# (bg_menu.jpg, bg_hero.jpg, bg_start.jpg, bg_history.jpg, bg_quit.jpg).
# Do NOT remove!
image = { version = "0.24", default-features = false, features = ["jpeg"] }
